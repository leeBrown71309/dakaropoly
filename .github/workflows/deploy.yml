name: Deploy

# Publishes the board to GitHub Pages on every push to pre-prod, so a game can
# be started from a phone that is not on the same Wi-Fi as the laptop.
#
# pre-prod is the stage before main: what lands here is what gets played
# against for real, and only what survives that moves on. A repository has a
# single Pages site, so main deliberately does not publish — it holds the code
# that has already been through here.
on:
  push:
    branches: [pre-prod]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A deploy already under way is left to finish; only queued ones are dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Typecheck and test
        run: |
          bun x tsc -p tsconfig.json --noEmit
          bun run test

      - name: Build
        # Both values are public by design — the key grants only what the row
        # level security policies allow. They live in repository secrets so
        # the project can be pointed somewhere else without touching the code.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
        run: bun run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
